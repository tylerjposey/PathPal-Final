kind = "mobile"
previewPath = "/orivis-mobile/"
title = "PathPal Mobile"
description = "A native PathPal prototype for Santa Clara County families and city teams to plan journeys, report neighborhood concerns, coordinate cleanup work, earn rewards, and explore a simulated SOS flow. Accounts, data, AI, notifications, transit, and emergency contacts are prototype features."
version = "1.0.0"
id = "artifacts/orivis-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/orivis-mobile/" ]
localPort = 25484

[services.development]
run = "pnpm --filter @workspace/orivis-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orivis-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/orivis-mobile", "run", "serve" ]

[services.env]
PORT = "25484"
BASE_PATH = "/orivis-mobile/"
