openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: journey
    description: Live transit journey operations
  - name: reports
    description: Community safety report operations
  - name: families
    description: Shared demo family invitations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /journey/options:
    get:
      operationId: getJourneyOptions
      tags: [journey]
      summary: Get ranked transit journey options
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/DestinationLatitude"
        - $ref: "#/components/parameters/DestinationLongitude"
        - $ref: "#/components/parameters/TravelMode"
      responses:
        "200":
          description: Ranked live journey options or clearly marked demo fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyOptionsResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/map:
    get:
      operationId: getJourneyMap
      tags: [journey]
      summary: Get journey options and available map formats
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/DestinationLatitude"
        - $ref: "#/components/parameters/DestinationLongitude"
        - $ref: "#/components/parameters/TravelMode"
        - name: routeId
          in: query
          required: false
          description: Optional route id (from journey/options) to render on the map. Defaults to the recommended route.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Journey options with a backend-proxied map image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyMapResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/map-3d:
    get:
      operationId: getJourneyMap3d
      tags: [journey]
      summary: Hosted interactive Google 3D map of one scheduled route
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/DestinationLatitude"
        - $ref: "#/components/parameters/DestinationLongitude"
        - $ref: "#/components/parameters/TravelMode"
        - name: routeId
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: heat
          in: query
          required: false
          description: Up to 80 semicolon-separated latitude,longitude,intensity points.
          schema: { type: string, maxLength: 3200 }
        - $ref: "#/components/parameters/ReportPoints"
      responses:
        "200":
          description: Interactive hosted 3D map document
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/map-image:
    get:
      operationId: getJourneyMapImage
      tags: [journey]
      summary: Proxy a Google static map image without exposing its API key
      parameters:
        - name: token
          in: query
          required: true
          description: Opaque, short-lived token issued by /journey/map identifying the map spec to render.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Static map image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "503":
          description: Static map is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/catalog:
    get:
      operationId: getJourneyCatalog
      tags: [journey]
      summary: Search the VTA route and stop catalog
      parameters:
        - name: query
          in: query
          required: false
          description: Optional case-insensitive search across route and stop names
          schema:
            type: string
            maxLength: 150
      responses:
        "200":
          description: Searchable VTA catalog or clearly marked demo fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCatalogResponse"
  /journey/places/autocomplete:
    get:
      operationId: getJourneyPlaceAutocomplete
      tags: [journey]
      summary: Autocomplete journey starting locations and destinations
      parameters:
        - $ref: "#/components/parameters/AutocompleteInput"
        - $ref: "#/components/parameters/PlacesSessionToken"
      responses:
        "200":
          description: Google Places predictions for general locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyPlaceAutocompleteResponse"
        "400":
          description: Invalid autocomplete query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Google Places is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/places/details:
    get:
      operationId: getJourneyPlaceDetails
      tags: [journey]
      summary: Resolve a selected place prediction to coordinates
      parameters:
        - $ref: "#/components/parameters/PlacesPlaceId"
        - $ref: "#/components/parameters/PlacesSessionToken"
      responses:
        "200":
          description: Selected place name and coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyPlaceDetailsResponse"
        "400":
          description: Invalid place selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Place details are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List reports visible to the signed demo role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Community reports ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityReport"
        "500":
          description: Reports could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a report for the signed demo account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReport"
        "400":
          description: Invalid report input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Photo exceeds the 2 MB decoded limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Report rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Photo storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/session:
    post:
      operationId: createReportSession
      tags: [reports]
      summary: Create a prototype-only signed demo session; these roles are not secure real accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportSessionInput"
      responses:
        "200":
          description: Signed bearer session, valid for 24 hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSession"
        "400":
          description: Invalid session input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid demo credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Session signing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /families/me:
    get:
      operationId: getMyFamily
      tags: [families]
      summary: Get the family associated with the shared demo parent session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Family account and joined children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyAccountResponse"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The session is not a parent session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No family has been created for this demo parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /families:
    post:
      operationId: createFamily
      tags: [families]
      summary: Create or retrieve the family for the shared demo parent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyInput"
      responses:
        "200":
          description: Family account with a server-generated unique invitation code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyAccountResponse"
        "400":
          description: Invalid family details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The session is not a parent session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A unique family code could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /families/join:
    post:
      operationId: joinFamily
      tags: [families]
      summary: Join a family using its server-generated invitation code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyInput"
      responses:
        "200":
          description: Family account after adding or retrieving the child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyAccountResponse"
        "400":
          description: Invalid child or invitation code details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invitation code was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The username is already assigned to another child in this family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/me:
    get:
      operationId: getTrackingProfile
      tags: [tracking]
      summary: Get the current Clerk account's separate live-tracking profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account-backed family profile and active journey summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingProfileResponse"
        "401":
          description: Missing or invalid Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The account has not joined a tracking family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/family:
    post:
      operationId: createTrackingFamily
      tags: [tracking]
      summary: Create a family owned by the current Clerk parent account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingFamilyInput"
      responses:
        "201":
          description: New account-backed tracking family and invitation code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingProfileResponse"
        "400":
          description: Invalid family name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This account already belongs to a tracking family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/family/join:
    post:
      operationId: joinTrackingFamily
      tags: [tracking]
      summary: Join a tracking family as a distinct Clerk child account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingFamilyJoinInput"
      responses:
        "200":
          description: Joined account-backed tracking family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingProfileResponse"
        "400":
          description: Invalid invitation code or child name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invitation code was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This account is already a family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/journeys:
    post:
      operationId: createTrackingJourney
      tags: [tracking]
      summary: Parent-approve a provider-routed journey for a child to opt into
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrackingJourneyInput"
      responses:
        "201":
          description: Journey request awaiting explicit child consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingJourneyResponse"
        "400":
          description: Journey route is missing provider geometry or valid endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only a parent in this tracking family can approve a journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/journeys/{id}/opt-in:
    post:
      operationId: optInToTrackingJourney
      tags: [tracking]
      summary: Record child consent and issue a short-lived journey-scoped location token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TrackingJourneyId"
      responses:
        "200":
          description: Child consent recorded and location session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingLocationSession"
        "403":
          description: Only the child assigned to this journey can opt in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Journey is no longer available for sharing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/journeys/{id}/locations:
    post:
      operationId: updateTrackingLocation
      tags: [tracking]
      summary: Match one active location fix against the selected provider route
      security:
        - trackingSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/TrackingJourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingLocationInput"
      responses:
        "200":
          description: Route progress and any newly generated checkpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingLocationUpdateResponse"
        "401":
          description: Invalid or expired journey-scoped location session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Sharing has ended or the journey has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/journeys/{id}/check-ins:
    post:
      operationId: recordTrackingCheckin
      tags: [tracking]
      summary: Record a child-confirmed route checkpoint without requiring GPS
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TrackingJourneyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingCheckinInput"
      responses:
        "200":
          description: Checkpoint recorded or existing duplicate returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingJourneyEvent"
        "403":
          description: Only the assigned child can record manual check-ins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/journeys/{id}/correct-arrival:
    post:
      operationId: correctTrackingArrival
      tags: [tracking]
      summary: Correct a false automatic arrival while preserving its audit event
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TrackingJourneyId"
      responses:
        "200":
          description: Journey reopened with location sharing stopped pending renewed consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingJourneyResponse"
        "403":
          description: Only the assigned child can correct arrival
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Journey has no correctable automatic arrival
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracking/journeys/{id}/end:
    post:
      operationId: endTrackingJourney
      tags: [tracking]
      summary: End sharing and immediately clear the temporary encrypted location
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TrackingJourneyId"
      responses:
        "200":
          description: Journey ended and location sharing credentials revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingJourneyResponse"
        "403":
          description: Account is not the parent or child assigned to this journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get complete report details and status history
      parameters:
        - $ref: "#/components/parameters/ReportId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Complete report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportDetail"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role is not authorized to view this report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Update case metadata as manager or status as assigned worker
      parameters:
        - $ref: "#/components/parameters/ReportId"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportUpdate"
      responses:
        "200":
          description: Updated report and one-time award indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportUpdateResult"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role is not authorized for this update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{id}/photo:
    get:
      operationId: getReportPhoto
      tags: [reports]
      summary: Stream a report photo from private object storage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Report or photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Private object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/demo/reset:
    post:
      operationId: resetDemoReports
      tags: [reports]
      summary: Restore six demonstration reports without deleting user reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restored demonstration report rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityReport"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the manager demo role may reset demonstration reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Latitude:
      name: lat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    Longitude:
      name: lng
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    Destination:
      name: destination
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 150
    DestinationLatitude:
      name: destinationLat
      in: query
      required: true
      description: Latitude from the selected destination place.
      schema:
        type: number
        minimum: -90
        maximum: 90
    DestinationLongitude:
      name: destinationLng
      in: query
      required: true
      description: Longitude from the selected destination place.
      schema:
        type: number
        minimum: -180
        maximum: 180
    AutocompleteInput:
      name: input
      in: query
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 150
    PlacesSessionToken:
      name: sessionToken
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    PlacesPlaceId:
      name: placeId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 300
    ReportPoints:
      name: reports
      in: query
      required: false
      description: Up to 80 semicolon-separated community-report latitude,longitude points.
      schema: { type: string, maxLength: 3200 }
    TravelMode:
      name: mode
      in: query
      required: false
      description: Restrict journey options to a travel mode. Defaults to considering both.
      schema:
        type: string
        enum: [any, walking, transit]
        default: any
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
    TrackingJourneyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    FamilyChild:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        username: { type: ["string", "null"] }
      required: [id, name, username]
    FamilyAccountResponse:
      type: object
      properties:
        familyId: { type: string, format: uuid }
        familyName: { type: string }
        invitationCode: { type: string, pattern: "^[0-9]{10}$" }
        children:
          type: array
