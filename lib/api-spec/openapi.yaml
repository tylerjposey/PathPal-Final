openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: journey
    description: Live transit journey operations
  - name: reports
    description: Community safety report operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /journey/options:
    get:
      operationId: getJourneyOptions
      tags: [journey]
      summary: Get ranked transit journey options
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Destination"
      responses:
        "200":
          description: Ranked live journey options or clearly marked demo fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyOptionsResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/map:
    get:
      operationId: getJourneyMap
      tags: [journey]
      summary: Get journey options and a protected static map image URL
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Destination"
        - name: routePolyline
          in: query
          required: false
          description: Optional encoded route polyline to display on the static map
          schema:
            type: string
            maxLength: 10000
      responses:
        "200":
          description: Journey options with a backend-proxied map image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyMapResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/map-image:
    get:
      operationId: getJourneyMapImage
      tags: [journey]
      summary: Proxy a Google static map image without exposing its API key
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: routePolyline
          in: query
          required: false
          schema:
            type: string
            maxLength: 10000
      responses:
        "200":
          description: Static map image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "503":
          description: Static map is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/catalog:
    get:
      operationId: getJourneyCatalog
      tags: [journey]
      summary: Search the VTA route and stop catalog
      parameters:
        - name: query
          in: query
          required: false
          description: Optional case-insensitive search across route and stop names
          schema:
            type: string
            maxLength: 150
      responses:
        "200":
          description: Searchable VTA catalog or clearly marked demo fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCatalogResponse"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List reports visible to the signed demo role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Community reports ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityReport"
        "500":
          description: Reports could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a report for the signed demo account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReport"
        "400":
          description: Invalid report input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Photo exceeds the 2 MB decoded limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Report rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Photo storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/session:
    post:
      operationId: createReportSession
      tags: [reports]
      summary: Create a prototype-only signed demo session; these roles are not secure real accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportSessionInput"
      responses:
        "200":
          description: Signed bearer session, valid for 24 hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSession"
        "400":
          description: Invalid session input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid demo credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Session signing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get complete report details and status history
      parameters:
        - $ref: "#/components/parameters/ReportId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Complete report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportDetail"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role is not authorized to view this report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Update case metadata as manager or status as assigned worker
      parameters:
        - $ref: "#/components/parameters/ReportId"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportUpdate"
      responses:
        "200":
          description: Updated report and one-time award indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportUpdateResult"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role is not authorized for this update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{id}/photo:
    get:
      operationId: getReportPhoto
      tags: [reports]
      summary: Stream a report photo from private object storage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Report or photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Private object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/demo/reset:
    post:
      operationId: resetDemoReports
      tags: [reports]
      summary: Restore six demonstration reports without deleting user reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restored demonstration report rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityReport"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the manager demo role may reset demonstration reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Latitude:
      name: lat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    Longitude:
      name: lng
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    Destination:
      name: destination
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 150
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    JourneyOptionsResponse:
      type: object
      properties:
        source:
          type: string
          enum: [live, demo]
        routes:
          type: array
          items:
            $ref: "#/components/schemas/JourneyRoute"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/JourneyStop"
        alerts:
          type: array
          items:
            type: string
        nearestStop:
          anyOf:
            - $ref: "#/components/schemas/JourneyStop"
            - type: "null"
        message:
          type: ["string", "null"]
      required: [source, routes, stops, alerts]
    JourneyMapResponse:
      allOf:
        - $ref: "#/components/schemas/JourneyOptionsResponse"
        - type: object
          properties:
            mapImageUrl:
              type: ["string", "null"]
          required: [mapImageUrl]
    JourneyRoute:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startStop:
          type: string
        destinationStop:
          type: string
        durationMinutes:
          type: integer
          minimum: 0
        walkingMeters:
          type: integer
          minimum: 0
        transfers:
          type: integer
          minimum: 0
        delayMinutes:
          type: integer
          minimum: 0
        alerts:
          type: array
          items:
            type: string
        available:
          type: boolean
        recommended:
          type: boolean
        source:
          type: string
          enum: [live, demo]
        polyline:
          type: ["string", "null"]
      required:
        - id
        - name
        - startStop
        - destinationStop
        - durationMinutes
        - walkingMeters
        - transfers
        - delayMinutes
        - alerts
        - available
        - recommended
        - source
    JourneyStop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        distanceMeters:
          type: ["integer", "null"]
      required: [id, name, lat, lng]
    JourneyCatalogResponse:
      type: object
      properties:
        source:
          type: string
          enum: [live, demo]
        routes:
          type: array
          items:
            type: string
        stops:
          type: array
          items:
            $ref: "#/components/schemas/JourneyStop"
        message:
          type: ["string", "null"]
      required: [source, routes, stops]
    CommunityReport:
      type: object
      properties:
        id: { type: string }
        category:
          type: string
          enum: [Blight, Illegal dumping, Unsafe bus stops, Damaged sidewalks, Poor lighting, Suspicious activity, Other concerns]
        summary: { type: string }
        description: { type: string }
        severity: { type: integer, minimum: 1, maximum: 10 }
        status:
          type: string
          enum: [Submitted, Under Review, Assigned, Resolved]
        location:
          type: string
          enum: [Downtown San Jose, Japantown, Willow Glen, East San Jose, Alum Rock, Santa Clara]
        x: { type: number }
        y: { type: number }
        photoUri: { type: ["string", "null"] }
        photoReference: { type: string }
        submittedAt: { type: string, format: date-time }
        recommendedDepartment: { type: string }
        priority:
          type: string
          enum: [Low, Medium, High]
        assignedTeam: { type: ["string", "null"] }
        awardedPoints: { type: boolean }
        reporterAccountId: { type: ["string", "null"] }
        familyAccountId: { type: ["string", "null"] }
        selectedCategory:
          type: ["string", "null"]
          enum: [Blight, Illegal dumping, Unsafe bus stops, Damaged sidewalks, Poor lighting, Suspicious activity, Other concerns, null]
        latitude: { type: ["number", "null"], minimum: 37.0, maximum: 37.6 }
        longitude: { type: ["number", "null"], minimum: -122.2, maximum: -121.6 }
        managerNotes: { type: ["string", "null"] }
        routeAssignment: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
        assignedAt: { type: ["string", "null"], format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
      required: [id, category, summary, description, severity, status, location, x, y, photoUri, photoReference, submittedAt, recommendedDepartment, priority, assignedTeam, awardedPoints, reporterAccountId, familyAccountId, selectedCategory, latitude, longitude, managerNotes, routeAssignment, updatedAt, assignedAt, resolvedAt]
    CommunityReportDetail:
      allOf:
        - $ref: "#/components/schemas/CommunityReport"
        - type: object
          properties:
            statusHistory:
              type: array
              items:
                $ref: "#/components/schemas/ReportStatusEvent"
          required: [statusHistory]
    ReportStatusEvent:
      type: object
      properties:
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: string, enum: [Submitted, Under Review, Assigned, Resolved] }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
      required: [fromStatus, toStatus, changedBy, changedAt]
    CommunityReportInput:
      type: object
      properties:
        description: { type: string, minLength: 12, maxLength: 4000 }
        location:
          type: string
          enum: [Downtown San Jose, Japantown, Willow Glen, East San Jose, Alum Rock, Santa Clara]
        category:
          type: ["string", "null"]
          enum: [Blight, Illegal dumping, Unsafe bus stops, Damaged sidewalks, Poor lighting, Suspicious activity, Other concerns]
        latitude: { type: number, minimum: 37.0, maximum: 37.6 }
        longitude: { type: number, minimum: -122.2, maximum: -121.6 }
        photoBase64: { type: string, maxLength: 2796204 }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required: [description, latitude, longitude]
    ReportSessionInput:
      type: object
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, enum: [parent, child, citizen, manager, worker] }
      required: [username, password, role]
    ReportSession:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time }
        role: { type: string, enum: [parent, child, citizen, manager, worker] }
        prototypeOnly: { type: boolean, enum: [true] }
      required: [accessToken, tokenType, expiresAt, role, prototypeOnly]
    CommunityReportUpdate:
      type: object
      properties:
        description: { type: string, minLength: 12, maxLength: 4000 }
        category:
          type: string
          enum: [Blight, Illegal dumping, Unsafe bus stops, Damaged sidewalks, Poor lighting, Suspicious activity, Other concerns]
        severity: { type: integer, minimum: 1, maximum: 10 }
        location:
          type: string
          enum: [Downtown San Jose, Japantown, Willow Glen, East San Jose, Alum Rock, Santa Clara]
        status:
          type: string
          enum: [Submitted, Under Review, Assigned, Resolved]
        assignedTeam: { type: ["string", "null"], maxLength: 120 }
        managerNotes: { type: ["string", "null"], maxLength: 4000 }
        routeAssignment: { type: ["string", "null"], maxLength: 160 }
        latitude: { type: number, minimum: 37.0, maximum: 37.6 }
        longitude: { type: number, minimum: -122.2, maximum: -121.6 }
    CommunityReportUpdateResult:
      type: object
      properties:
        report:
          $ref: "#/components/schemas/CommunityReport"
        awardedPoints:
          type: boolean
          description: True only when this update newly resolves the report for the first time.
      required: [report, awardedPoints]

