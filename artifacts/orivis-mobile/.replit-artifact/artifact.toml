kind = "mobile"
previewPath = "/orivis-mobile/"
title = "Orivis Mobile"
description = "A native mobile prototype for Santa Clara County families and city teams to coordinate planned bus journeys, report neighborhood safety concerns, manage cleanup work, earn rewards, and demonstrate a simulated SOS experience. All accounts, data, AI, notifications, transit, and emergency contacts are simulated."
version = "1.0.0"
id = "artifacts/orivis-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/orivis-mobile/" ]
localPort = 25484

[services.development]
run = "pnpm --filter @workspace/orivis-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orivis-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/orivis-mobile", "run", "serve" ]

[services.env]
PORT = "25484"
BASE_PATH = "/orivis-mobile/"
