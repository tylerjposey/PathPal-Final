openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: journey
    description: Live transit journey operations
  - name: reports
    description: Community safety report operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /journey/options:
    get:
      operationId: getJourneyOptions
      tags: [journey]
      summary: Get ranked transit journey options
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/DestinationLatitude"
        - $ref: "#/components/parameters/DestinationLongitude"
        - $ref: "#/components/parameters/TravelMode"
      responses:
        "200":
          description: Ranked live journey options or clearly marked demo fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyOptionsResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/map:
    get:
      operationId: getJourneyMap
      tags: [journey]
      summary: Get journey options and available map formats
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/DestinationLatitude"
        - $ref: "#/components/parameters/DestinationLongitude"
        - $ref: "#/components/parameters/TravelMode"
        - name: routeId
          in: query
          required: false
          description: Optional route id (from journey/options) to render on the map. Defaults to the recommended route.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Journey options with a backend-proxied map image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyMapResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/map-3d:
    get:
      operationId: getJourneyMap3d
      tags: [journey]
      summary: Hosted interactive Google 3D map of one scheduled route
      parameters:
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/Destination"
        - $ref: "#/components/parameters/DestinationLatitude"
        - $ref: "#/components/parameters/DestinationLongitude"
        - $ref: "#/components/parameters/TravelMode"
        - name: routeId
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: heat
          in: query
          required: false
          description: Up to 80 semicolon-separated latitude,longitude,intensity points.
          schema: { type: string, maxLength: 3200 }
        - $ref: "#/components/parameters/ReportPoints"
      responses:
        "200":
          description: Interactive hosted 3D map document
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/map-image:
    get:
      operationId: getJourneyMapImage
      tags: [journey]
      summary: Proxy a Google static map image without exposing its API key
      parameters:
        - name: token
          in: query
          required: true
          description: Opaque, short-lived token issued by /journey/map identifying the map spec to render.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Static map image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "503":
          description: Static map is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/catalog:
    get:
      operationId: getJourneyCatalog
      tags: [journey]
      summary: Search the VTA route and stop catalog
      parameters:
        - name: query
          in: query
          required: false
          description: Optional case-insensitive search across route and stop names
          schema:
            type: string
            maxLength: 150
      responses:
        "200":
          description: Searchable VTA catalog or clearly marked demo fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCatalogResponse"
  /journey/places/autocomplete:
    get:
      operationId: getJourneyPlaceAutocomplete
      tags: [journey]
      summary: Autocomplete journey starting locations and destinations
      parameters:
        - $ref: "#/components/parameters/AutocompleteInput"
        - $ref: "#/components/parameters/PlacesSessionToken"
      responses:
        "200":
          description: Google Places predictions for general locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyPlaceAutocompleteResponse"
        "400":
          description: Invalid autocomplete query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Google Places is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /journey/places/details:
    get:
      operationId: getJourneyPlaceDetails
      tags: [journey]
      summary: Resolve a selected place prediction to coordinates
      parameters:
        - $ref: "#/components/parameters/PlacesPlaceId"
        - $ref: "#/components/parameters/PlacesSessionToken"
      responses:
        "200":
          description: Selected place name and coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyPlaceDetailsResponse"
        "400":
          description: Invalid place selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Place details are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /accounts/me:
    get:
      operationId: getAccountStatus
      tags: [accounts]
      summary: Get the signed-in user's PathPal account and approval status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account status; pending children receive no family details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "401":
          description: Missing or invalid Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /accounts/bootstrap-manager:
    post:
      operationId: bootstrapInitialManager
      tags: [accounts]
      summary: Create the initial manager only for the maintainer-configured Clerk user
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Initial manager account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "403":
          description: Signed-in user is not the configured maintainer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /accounts/parent:
    post:
      operationId: createParentAccount
      tags: [accounts]
      summary: Create the signed-in user's parent account and family
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentAccountInput"
      responses:
        "201":
          description: Parent account and family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
  /accounts/child:
    post:
      operationId: createChildAccount
      tags: [accounts]
      summary: Request to join a family using its invitation code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildAccountInput"
      responses:
        "201":
          description: Child account created in pending approval state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "400":
          description: Invitation code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account already has a profile or pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /accounts/staff:
    post:
      operationId: acceptStaffInvitation
      tags: [accounts]
      summary: Accept a City Manager or City Worker invitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitationAcceptance"
      responses:
        "201":
          description: Staff account created with the invited role and team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "400":
          description: Invitation is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account already has a profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /families/me:
    get:
      operationId: getMyFamily
      tags: [families]
      summary: Get family information visible to the signed-in member
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Family management data; only the owning parent receives the invitation code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyView"
        "403":
          description: Family data is not available to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /families/me/journey:
    get:
      operationId: getFamilyJourney
      tags: [families]
      summary: Get the family's currently shared journey
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The active family journey, if one has been saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyJourneyResponse"
        "401":
          description: Missing or invalid Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only an approved parent or child may access family journeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveFamilyJourney
      tags: [families]
      summary: Save or replace the family's shared journey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyJourneyInput"
      responses:
        "200":
          description: The saved family journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyJourneyResponse"
        "400":
          description: Invalid journey or endpoint data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only an approved parent or child may save family journeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /families/me/journey/check-ins:
    post:
      operationId: confirmFamilyJourneyMilestone
      tags: [families]
      summary: Record the next child journey check-in for the family
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyJourneyCheckInInput"
      responses:
        "200":
          description: The updated shared journey progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyJourneyResponse"
        "400":
          description: Invalid journey milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only an approved child may check in to a family journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No family journey has been saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Journey check-ins must be confirmed in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /families/requests/{id}/approve:
    post:
      operationId: approveFamilyJoinRequest
      tags: [families]
      summary: Approve a pending child request as the owning parent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FamilyMembershipId"
      responses:
        "200":
          description: Child approved and connected to the family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyRequestResult"
        "403":
          description: Only the owning parent may approve the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pending request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /families/requests/{id}/reject:
    post:
      operationId: rejectFamilyJoinRequest
      tags: [families]
      summary: Reject a pending child request as the owning parent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FamilyMembershipId"
      responses:
        "200":
          description: Child request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyRequestResult"
        "403":
          description: Only the owning parent may reject the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pending request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the signed-in account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account-scoped notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PathPalNotification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one of the signed-in user's notifications as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PathPalNotification"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /staff/invitations:
    post:
      operationId: createStaffInvitation
      tags: [staff]
      summary: Issue a one-time City Manager or City Worker invitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitationInput"
      responses:
        "201":
          description: Invitation created; the code is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitation"
        "403":
          description: Only a City Case Manager may invite staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/map-data:
    get:
      operationId: getReportMapData
      tags: [reports]
      summary: Get authorized report markers and anonymous aggregate heat cells
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role-scoped markers and anonymous public heat data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportMapData"
        "401":
          description: Missing or invalid Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is pending parent approval or is not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/public-heat:
    get:
      operationId: getPublicReportHeat
      tags: [reports]
      summary: Get anonymized report-density cells without report identifiers
      security: []
      responses:
        "200":
          description: Heat cells aggregated across at least three reports each
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHeatCell"
  /reports/session:
    post:
      operationId: createReportSession
      tags: [reports]
      summary: Start a role-scoped demonstration session in development
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportSessionInput"
      responses:
        "200":
          description: Signed demonstration session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSession"
        "400":
          description: Invalid session input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Demonstration credentials were rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Demonstration sessions are disabled outside development
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Demonstration session signing is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/phone-session:
    post:
      operationId: createPhoneReportSession
      tags: [reports]
      summary: Start the simulated phone demonstration session in development
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneReportSessionInput"
      responses:
        "200":
          description: Signed Parent demonstration session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSession"
        "400":
          description: Invalid phone session input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Demonstration phone credentials were rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Demonstration sessions are disabled outside development
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Demonstration session signing is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List reports visible to the signed demo role
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Community reports ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityReport"
        "500":
          description: Reports could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a report for the signed demo account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReport"
        "400":
          description: Invalid report input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Photo exceeds the 2 MB decoded limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Report rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Photo storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get complete report details and status history
      parameters:
        - $ref: "#/components/parameters/ReportId"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Complete report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportDetail"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role is not authorized to view this report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReport
      tags: [reports]
      summary: Update case metadata as manager or status as assigned worker
      parameters:
        - $ref: "#/components/parameters/ReportId"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportUpdate"
      responses:
        "200":
          description: Updated report and one-time award indicator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportUpdateResult"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role is not authorized for this update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{id}/photo:
    get:
      operationId: getReportPhoto
      tags: [reports]
      summary: Stream a report photo from private object storage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Report or photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Private object storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/demo/reset:
    post:
      operationId: resetDemoReports
      tags: [reports]
      summary: Restore six demonstration reports without deleting user reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Restored demonstration report rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityReport"
        "401":
          description: Missing or invalid bearer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only the manager demo role may reset demonstration reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Latitude:
      name: lat
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    Longitude:
      name: lng
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    Destination:
      name: destination
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 150
    DestinationLatitude:
      name: destinationLat
      in: query
      required: true
      description: Latitude from the selected destination place.
      schema:
        type: number
        minimum: -90
        maximum: 90
    DestinationLongitude:
      name: destinationLng
      in: query
      required: true
      description: Longitude from the selected destination place.
      schema:
        type: number
        minimum: -180
        maximum: 180
    AutocompleteInput:
      name: input
      in: query
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 150
    PlacesSessionToken:
      name: sessionToken
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    PlacesPlaceId:
      name: placeId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 300
    ReportPoints:
      name: reports
      in: query
      required: false
      description: Up to 80 semicolon-separated community-report latitude,longitude points.
      schema: { type: string, maxLength: 3200 }
    TravelMode:
      name: mode
      in: query
      required: false
      description: Restrict journey options to a travel mode. Defaults to considering both.
      schema:
        type: string
        enum: [any, walking, transit]
        default: any
    ReportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
    FamilyMembershipId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AccountStatus:
      type: object
      properties:
        status:
          type: string
          enum: [needs_setup, parent, child_pending, child_approved, child_rejected, manager, worker]
        userId: { type: string }
        displayName: { type: string }
        familyId: { type: ["string", "null"] }
        familyName: { type: ["string", "null"] }
        approvalDeadline: { type: ["string", "null"], format: date-time }
        teamName: { type: ["string", "null"] }
      required: [status, userId, displayName, familyId, familyName, approvalDeadline, teamName]
    ParentAccountInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        familyName: { type: string, minLength: 1, maxLength: 100 }
      required: [displayName, familyName]
    ChildAccountInput:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        invitationCode: { type: string, minLength: 6, maxLength: 24 }
      required: [displayName, invitationCode]
    StaffInvitationAcceptance:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        invitationCode: { type: string, minLength: 12, maxLength: 80 }
      required: [displayName, invitationCode]
    FamilyMember:
      type: object
      properties:
        membershipId: { type: integer }
        displayName: { type: string }
        role: { type: string, enum: [parent, child] }
        status: { type: string, enum: [pending, approved, rejected] }
        requestedAt: { type: string, format: date-time }
        approvedAt: { type: ["string", "null"], format: date-time }
      required: [membershipId, displayName, role, status, requestedAt, approvedAt]
    FamilyView:
      type: object
      properties:
        state: { type: string, enum: [parent, child_pending, child_approved, child_rejected] }
        familyName: { type: ["string", "null"] }
        invitationCode: { type: ["string", "null"], description: Only returned to the owning parent }
        approvalDeadline: { type: ["string", "null"], format: date-time }
        members:
          type: array
          items: { $ref: "#/components/schemas/FamilyMember" }
        pendingRequests:
          type: array
          items: { $ref: "#/components/schemas/FamilyMember" }
      required: [state, familyName, invitationCode, approvalDeadline, members, pendingRequests]
    FamilyJourneyEndpoint:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
      required: [name, latitude, longitude]
    FamilyJourneyInput:
      type: object
      properties:
        route:
          $ref: "#/components/schemas/JourneyRoute"
        origin:
          $ref: "#/components/schemas/FamilyJourneyEndpoint"
        destination:
          $ref: "#/components/schemas/FamilyJourneyEndpoint"
      required: [route, origin, destination]
    FamilyJourneyCheckInInput:
      type: object
      properties:
        milestoneIndex: { type: integer, minimum: 0, maximum: 100 }
      required: [milestoneIndex]
    FamilyJourney:
      type: object
      properties:
        id: { type: string, format: uuid }
        route:
          $ref: "#/components/schemas/JourneyRoute"
        origin:
          $ref: "#/components/schemas/FamilyJourneyEndpoint"
        destination:
          $ref: "#/components/schemas/FamilyJourneyEndpoint"
        milestoneIndex: { type: integer, minimum: -1, maximum: 100 }
        tripUpdatedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, route, origin, destination, milestoneIndex, tripUpdatedAt, createdAt, updatedAt]
    FamilyJourneyResponse:
      type: object
      properties:
        journey:
          oneOf:
            - $ref: "#/components/schemas/FamilyJourney"
            - type: "null"
      required: [journey]
    FamilyRequestResult:
      type: object
      properties:
        membershipId: { type: integer }
        status: { type: string, enum: [approved, rejected] }
      required: [membershipId, status]
    PathPalNotification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [child_join_request, child_approved, child_rejected] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
      required: [id, type, title, body, createdAt, readAt]
    StaffInvitationInput:
      type: object
      properties:
        role: { type: string, enum: [manager, worker] }
        teamName: { type: ["string", "null"], maxLength: 120 }
      required: [role]
    StaffInvitation:
      type: object
      properties:
        invitationCode: { type: string }
        role: { type: string, enum: [manager, worker] }
        teamName: { type: ["string", "null"] }
        expiresAt: { type: string, format: date-time }
      required: [invitationCode, role, teamName, expiresAt]
    ReportMapMarker:
      type: object
      properties:
        id: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        severity: { type: ["integer", "null"], minimum: 1, maximum: 10 }
        status: { type: string, enum: [Submitted, Under Review, Assigned, Resolved] }
        assignedTeam: { type: ["string", "null"] }
        routeAssignment: { type: ["string", "null"] }
      required: [id, latitude, longitude, severity, status, assignedTeam, routeAssignment]
    PublicHeatCell:
      type: object
      properties:
        latitude: { type: number }
        longitude: { type: number }
        intensity: { type: number, minimum: 0, maximum: 1 }
      required: [latitude, longitude, intensity]
    ReportMapData:
      type: object
      properties:
        markers:
          type: array
          items: { $ref: "#/components/schemas/ReportMapMarker" }
        publicHeat:
          type: array
          items: { $ref: "#/components/schemas/PublicHeatCell" }
      required: [markers, publicHeat]
    JourneyOptionsResponse:
      type: object
      properties:
        source:
          type: string
          enum: [live, demo]
        routes:
          type: array
          items:
            $ref: "#/components/schemas/JourneyRoute"
        stops:
          type: array
          items:
            $ref: "#/components/schemas/JourneyStop"
        alerts:
          type: array
          items:
            type: string
        nearestStop:
          anyOf:
            - $ref: "#/components/schemas/JourneyStop"
            - type: "null"
        message:
          type: ["string", "null"]
      required: [source, routes, stops, alerts]
    JourneyMapResponse:
      allOf:
        - $ref: "#/components/schemas/JourneyOptionsResponse"
        - type: object
          properties:
            mapImageUrl:
              type: ["string", "null"]
            map3dAvailable:
              type: boolean
              description: True only when a separate browser-restricted Maps JavaScript key is configured.
          required: [mapImageUrl, map3dAvailable]
    JourneyRoute:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startStop:
          type: string
        destinationStop:
          type: string
        durationMinutes:
          type: integer
          minimum: 0
        walkingMeters:
          type: integer
          minimum: 0
        transfers:
          type: integer
          minimum: 0
        delayMinutes:
          type: integer
          minimum: 0
        alerts:
          type: array
          items:
            type: string
        available:
          type: boolean
        recommended:
          type: boolean
        source:
          type: string
          enum: [live, demo]
        polyline:
          type: ["string", "null"]
        mode:
          type: string
          enum: [walking, transit]
        legs:
          type: array
          items:
            $ref: "#/components/schemas/JourneyLeg"
      required:
        - id
        - name
        - startStop
        - destinationStop
        - durationMinutes
        - walkingMeters
        - transfers
        - delayMinutes
        - alerts
        - available
        - recommended
        - source
        - mode
        - legs
    JourneyLeg:
      type: object
      description: One ordered segment of a journey - either a walk or a single VTA bus ride.
      properties:
        type:
          type: string
          enum: [walk, bus]
        routeNumber:
          type: ["string", "null"]
          description: Public VTA route code (e.g. "22"), null for walking legs.
        routeName:
          type: ["string", "null"]
        boardingStop:
          $ref: "#/components/schemas/JourneyStop"
        alightingStop:
          $ref: "#/components/schemas/JourneyStop"
        distanceMeters:
          type: integer
          minimum: 0
        durationMinutes:
          type: integer
          minimum: 0
        delayMinutes:
          type: ["integer", "null"]
        predictedArrival:
          type: ["string", "null"]
          format: date-time
        transferGuidance:
          type: ["string", "null"]
        polyline:
          type: ["string", "null"]
      required:
        - type
        - routeNumber
        - routeName
        - boardingStop
        - alightingStop
        - distanceMeters
        - durationMinutes
        - delayMinutes
        - predictedArrival
        - transferGuidance
        - polyline
    JourneyStop:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        distanceMeters:
          type: ["integer", "null"]
      required: [id, name, lat, lng]
    JourneyCatalogResponse:
      type: object
      properties:
        source:
          type: string
          enum: [live, demo]
        routes:
          type: array
          items:
            type: string
        stops:
          type: array
          items:
            $ref: "#/components/schemas/JourneyStop"
        message:
          type: ["string", "null"]
      required: [source, routes, stops]
    JourneyPlaceSuggestion:
      type: object
      properties:
        placeId: { type: string, maxLength: 300 }
        name: { type: string, maxLength: 200 }
        description: { type: ["string", "null"], maxLength: 300 }
      required: [placeId, name]
    JourneyPlaceAutocompleteResponse:
      type: object
      properties:
        source:
          type: string
          enum: [google]
        suggestions:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/JourneyPlaceSuggestion"
      required: [source, suggestions]
    JourneyPlaceDetailsResponse:
      type: object
      properties:
        placeId: { type: string, maxLength: 300 }
        name: { type: string, maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
      required: [placeId, name, latitude, longitude]
    CommunityReport:
      type: object
      properties:
        id: { type: string }
        category:
          type: string
          enum: [Blight, Illegal dumping, Unsafe bus stops, Damaged sidewalks, Poor lighting, Suspicious activity, Other concerns]
        summary: { type: string }
        description: { type: string }
        severity: { type: integer, minimum: 1, maximum: 10 }
        status:
          type: string
          enum: [Submitted, Under Review, Assigned, Resolved]
        location:
          type: string
          enum: [Downtown San Jose, Japantown, Willow Glen, East San Jose, Alum Rock, Santa Clara]
        x: { type: number }
        y: { type: number }
        photoUri: { type: ["string", "null"] }
        photoReference: { type: string }
        submittedAt: { type: string, format: date-time }
        recommendedDepartment: { type: string }
        priority:
          type: string
          enum: [Low, Medium, High]
        assignedTeam: { type: ["string", "null"] }
        awardedPoints: { type: boolean }
        reporterAccountId: { type: ["string", "null"] }
        familyAccountId: { type: ["string", "null"] }
        reporterUserId: { type: ["string", "null"] }
        familyId: { type: ["string", "null"] }
        selectedCategory:
          type: ["string", "null"]
          enum: [Blight, Illegal dumping, Unsafe bus stops, Damaged sidewalks, Poor lighting, Suspicious activity, Other concerns, null]
        latitude: { type: ["number", "null"], minimum: 37.0, maximum: 37.6 }
        longitude: { type: ["number", "null"], minimum: -122.2, maximum: -121.6 }
        managerNotes: { type: ["string", "null"] }
        routeAssignment: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
        assignedAt: { type: ["string", "null"], format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
      required: [id, category, summary, description, severity, status, location, x, y, photoUri, photoReference, submittedAt, recommendedDepartment, priority, assignedTeam, awardedPoints, reporterAccountId, familyAccountId, reporterUserId, familyId, selectedCategory, latitude, longitude, managerNotes, routeAssignment, updatedAt, assignedAt, resolvedAt]
    CommunityReportDetail:
      allOf:
        - $ref: "#/components/schemas/CommunityReport"
        - type: object
          properties:
            statusHistory:
              type: array
              items:
                $ref: "#/components/schemas/ReportStatusEvent"
          required: [statusHistory]
    ReportStatusEvent:
      type: object
      properties:
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: string, enum: [Submitted, Under Review, Assigned, Resolved] }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
      required: [fromStatus, toStatus, changedBy, changedAt]
    ReportSessionInput:
      type: object
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 128 }
        role:
          type: string
          enum: [parent, child, manager, worker]
        verificationCode: { type: string, minLength: 4, maxLength: 8 }
      required: [username, password, role, verificationCode]
    PhoneReportSessionInput:
      type: object
      properties:
        phoneNumber: { type: string, minLength: 7, maxLength: 32 }
        verificationCode: { type: string, pattern: "^[0-9]{4}$" }
      required: [phoneNumber, verificationCode]
    ReportSession:
      type: object
      properties:
        accessToken: { type: string, minLength: 1 }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time }
        role:
          type: string
          enum: [parent, child, manager, worker]
        userId: { type: string }
        displayName: { type: string }
        prototypeOnly: { type: boolean, enum: [true] }
      required: [accessToken, tokenType, expiresAt, role, userId, displayName, prototypeOnly]
    CommunityReportInput:
      type: object
      properties:
        description: { type: string, minLength: 12, maxLength: 4000 }
        location:
          type: string
          enum: [Downtown San Jose, Japantown, Willow Glen, East San Jose, Alum Rock, Santa Clara]
        category:
          type: ["string", "null"]
          enum: [Blight, Illegal dumping, Unsafe bus stops, Damaged sidewalks, Poor lighting, Suspicious activity, Other concerns]
        latitude: { type: number, minimum: 37.0, maximum: 37.6 }
        longitude: { type: number, minimum: -122.2, maximum: -121.6 }
        photoBase64: { type: string, maxLength: 2796204 }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required: [description, latitude, longitude]
    CommunityReportUpdate:
      type: object
      properties:
        description: { type: string, minLength: 12, maxLength: 4000 }
        category:
          type: string
          enum: [Blight, Illegal dumping, Unsafe bus stops, Damaged sidewalks, Poor lighting, Suspicious activity, Other concerns]
        severity: { type: integer, minimum: 1, maximum: 10 }
        location:
          type: string
          enum: [Downtown San Jose, Japantown, Willow Glen, East San Jose, Alum Rock, Santa Clara]
        status:
          type: string
          enum: [Submitted, Under Review, Assigned, Resolved]
        assignedTeam: { type: ["string", "null"], maxLength: 120 }
        managerNotes: { type: ["string", "null"], maxLength: 4000 }
        routeAssignment: { type: ["string", "null"], maxLength: 160 }
        latitude: { type: number, minimum: 37.0, maximum: 37.6 }
        longitude: { type: number, minimum: -122.2, maximum: -121.6 }
    CommunityReportUpdateResult:
      type: object
      properties:
        report:
          $ref: "#/components/schemas/CommunityReport"
        awardedPoints:
          type: boolean
          description: True only when this update newly resolves the report for the first time.
      required: [report, awardedPoints]

